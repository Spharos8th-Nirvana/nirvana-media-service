server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: media-service
  profiles:
    default: local
  cloud:
    config:
      enabled: false
  # DDL 컬럼이 camelCase라 Entity 필드 이름을 그대로 테이블·컬럼 이름으로 쓴다. (기본값은 snake_case로 바꾼다)
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13309}/nirvana_media?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:media}
    password: ${DB_PASSWORD:media}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: config-server
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
